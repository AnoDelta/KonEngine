name: KonScript Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  konscript-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang lld llvm \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev \
            libxinerama-dev libxcursor-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            mingw-w64 xz-utils wget libssl-dev zlib1g-dev

      - name: Build konscript
        working-directory: tools/KonScript
        run: ./build.sh

      - name: Download llvm-mingw
        working-directory: tools/KonScript
        run: |
          VER="20250512"
          FILE="llvm-mingw-${VER}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          URL="https://github.com/mstorsjo/llvm-mingw/releases/download/${VER}/${FILE}"
          mkdir -p toolchain/llvm-mingw
          wget -q "$URL" -O /tmp/llvm-mingw.tar.xz
          tar -xf /tmp/llvm-mingw.tar.xz -C toolchain/llvm-mingw --strip-components=1

      - name: Build engine libs
        working-directory: tools/KonScript
        run: |
          chmod +x build-engine-lib.sh
          ./build-engine-lib.sh --windows

      - name: Package
        working-directory: tools/KonScript
        run: |
          TAG="${{ github.ref_name }}"
          mkdir -p staging
          cp konscript staging/
          cp build-engine-lib.sh bundle-toolchain.sh staging/
          cp -r toolchain/engine staging/
          cp -r toolchain/llvm-mingw staging/
          mkdir -p staging/toolchain/llvm/bin
          for t in llc ld.lld lld-link clang++ llvm-ar; do
            BIN=$(command -v $t 2>/dev/null || true)
            [ -n "$BIN" ] && cp "$BIN" staging/toolchain/llvm/bin/ || true
          done
          tar -czf "KonScript-${TAG}-linux-x86_64.tar.gz" -C staging .

      - name: Upload
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          files: tools/KonScript/KonScript-${{ github.ref_name }}-linux-x86_64.tar.gz

  konscript-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM
        run: choco install llvm --yes

      - name: Generage logo
        shell: pwsh
        run: python tools/gen_kon_logo.py src/window/kon_logo.h logo.png

      - name: Build konscript.exe
        working-directory: tools/KonScript
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          copy build\Release\konscript.exe konscript.exe

      - name: Download llvm-mingw
        shell: pwsh
        working-directory: tools/KonScript
        run: |
          $ver  = "20250512"
          $file = "llvm-mingw-$ver-ucrt-x86_64.zip"
          $url  = "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/$file"
          New-Item -ItemType Directory -Force -Path toolchain/llvm-mingw | Out-Null
          Invoke-WebRequest $url -OutFile "$env:TEMP\llvm-mingw.zip"
          Expand-Archive "$env:TEMP\llvm-mingw.zip" -DestinationPath "$env:TEMP\llvm-mingw-src"
          $inner = Get-ChildItem "$env:TEMP\llvm-mingw-src" | Select-Object -First 1
          Copy-Item "$($inner.FullName)\*" "toolchain/llvm-mingw/" -Recurse

      - name: Build engine lib (windows64)
        shell: pwsh
        working-directory: tools/KonScript
        run: |
          $cc  = "toolchain/llvm-mingw/bin/x86_64-w64-mingw32-clang++"
          $ar  = "toolchain/llvm-mingw/bin/llvm-ar"
          $out = "toolchain/engine/windows64"
          $bld = "toolchain/_build/engine_win"
          New-Item -ItemType Directory -Force -Path $out, $bld | Out-Null
          $srcs = Get-ChildItem -Recurse ../../src -Filter "*.cpp" |
                  Where-Object { $_.Name -notmatch "anim_compiler" }
          $objs = @()
          foreach ($s in $srcs) {
            $o = "$bld/$($s.BaseName).o"
            & $cc -std=c++17 -O2 -DNDEBUG -I../../src -I../../src/glad/include `
              -I../../src/stb -I../../libs/glfw/include -I../../libs/glm `
              -c $s.FullName -o $o 2>$null
            if (Test-Path $o) { $objs += $o }
          }
          $go = "$bld/glad.o"
          & $cc -O2 -DNDEBUG -I../../src/glad/include -x c -c ../../src/glad/src/glad.c -o $go 2>$null
          if (Test-Path $go) { $objs += $go }
          & $ar rcs "$out/libKonEngine.a" $objs
          New-Item -ItemType Directory -Force -Path "$out/include" | Out-Null
          Copy-Item ../../src/KonEngine.hpp "$out/include/"
          Get-ChildItem -Recurse ../../src -Filter "*.hpp" | ForEach-Object {
            $rel = $_.FullName.Substring((Resolve-Path ../../src).Path.Length + 1)
            $dst = "$out/include/$rel"
            New-Item -ItemType Directory -Force -Path (Split-Path $dst) | Out-Null
            Copy-Item $_.FullName $dst
          }
          Copy-Item -Recurse ../../libs/glm/glm "$out/include/glm"
          New-Item -ItemType Directory -Force -Path "$out/include/GLFW" | Out-Null
          Copy-Item ../../libs/glfw/include/GLFW/* "$out/include/GLFW/"

      - name: Package
        shell: pwsh
        working-directory: tools/KonScript
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item konscript.exe staging/
          Copy-Item -Recurse toolchain/engine/windows64 staging/engine-windows64
          Copy-Item -Recurse toolchain/llvm-mingw staging/llvm-mingw
          Compress-Archive -Path staging/* -DestinationPath "KonScript-${tag}-windows-x86_64.zip"

      - name: Upload
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: tools/KonScript/KonScript-${{ github.ref_name }}-windows-x86_64.zip
